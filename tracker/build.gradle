dependencies {
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.kafka:spring-kafka'
    implementation "org.liquibase:liquibase-core"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${project.springdocOpenapiStarterWebmvcUiVersion}"
    implementation "io.jsonwebtoken:jjwt-api:${project.jsonWebTokenVersion}"
    implementation "io.jsonwebtoken:jjwt-impl:${project.jsonWebTokenVersion}"
    implementation "io.jsonwebtoken:jjwt-jackson:${project.jsonWebTokenVersion}"
	implementation 'org.modelmapper:modelmapper:3.2.1'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.springframework.security:spring-security-test'
}
