spring:
  application:
    name: task-tracker-notification
  kafka:
    listener:
      ack-mode: record
      concurrency: 1
    consumer:
      client-id: ${spring.application.name}
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            type:
              mapping: com.shimady.auth.model.dto.EmailMessage:com.shimady.notification.model.EmailMessage,
                com.shimady.auth.model.dto.PushMessage:com.shimady.notification.model.PushMessage,
                com.shimady.tracker.model.messaging.ReminderMessage:com.shimady.notification.model.ReminderMessage,
                com.shimady.auth.model.dto.SMSMessage:com.shimady.notification.model.SMSMessage
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

management:
  endpoints:
    web.exposure.include: "*"
  endpoint:
    health:
      probes.enabled: true
      show-details: always
      access: unrestricted
    info:
      access: unrestricted

server:
  servlet:
    context-path: /api/v1/notification

kafka:
  topics:
    email:
      name: emailTopic
      replication-factor: 1
      partitions: 1
    sms:
      name: smsTopic
      replication-factor: 1
      partitions: 1
    push:
      name: pushTopic
      replication-factor: 1
      partitions: 1
    reminder:
      name: reminderTopic
      replication-factor: 1
      partitions: 1

logging:
  level:
    root: info
    org.springframework.mail: DEBUG
    com.sun.mail: DEBUG