# Secret для auth сервиса
# ВАЖНО: В production используйте Kubernetes Secrets или внешний secret manager
# Для создания secret вручную:
# kubectl create secret generic auth-secret \
#   --from-literal=db-username=postgres \
#   --from-literal=db-password=YOUR_PASSWORD \
#   --from-literal=redis-password=YOUR_REDIS_PASSWORD \
#   --from-literal=jwt-access-secret=YOUR_ACCESS_SECRET \
#   --from-literal=jwt-refresh-secret=YOUR_REFRESH_SECRET \
#   --namespace=backend

apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: backend
  labels:
    app: auth
    component: microservice
type: Opaque
stringData:
  # Database credentials
  db-username: postgres
  db-password: postgres  # ЗАМЕНИТЕ НА СИЛЬНЫЙ ПАРОЛЬ!
  
  # Redis password
  redis-password: redis  # ЗАМЕНИТЕ НА СИЛЬНЫЙ ПАРОЛЬ!
  
  # JWT secrets (ЗАМЕНИТЕ НА СИЛЬНЫЕ СЕКРЕТЫ!)
  jwt-access-secret: "e2572ccf3dad3fbae0d34ab2d395a3d8d538d9031b0c3037f302c077c344cd6c75e15ab7a5322fcf35e87d1ad3e813008f7bff153d4b912d358da6707ff10825"
  jwt-refresh-secret: "4e7dd4cfb4136b7aefd2560492b843a9c5cd006553dbb4c3f6e3ddbdac5fe1e67534ede1045df8ca0e88790e9df24a2e567bc0a3196663890825a012e3717adc"
  
  # JWT cookie names
  jwt-access-cookie-name: "coding_contest_system_access_token"
  jwt-refresh-cookie-name: "coding_contest_system_refresh_token"
  
  # JWT expiration (в миллисекундах)
  jwt-access-expiration: "86400000"  # 24 часа
  jwt-refresh-expiration: "604800000"  # 1 неделя


