# Service для auth сервиса
# ClusterIP - доступен только внутри кластера
# Используется другими сервисами и Ingress для доступа к API

apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: backend
  labels:
    app: auth
    component: microservice
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: auth
    component: microservice


