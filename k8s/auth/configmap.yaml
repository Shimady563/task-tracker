# ConfigMap для auth сервиса
# Содержит не-секретные конфигурационные параметры

apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: backend
  labels:
    app: auth
    component: microservice
data:
  # Spring Boot конфигурация
  SPRING_APPLICATION_NAME: "AuthService"
  SPRING_PROFILES_ACTIVE: "prod"
  
  # Database конфигурация (host и port)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/tracker"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  
  # Redis конфигурация
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  
  # Kafka конфигурация
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-kafka-bootstrap:9092"
  SPRING_KAFKA_PRODUCER_CLIENT_ID: "AuthService"
  SPRING_KAFKA_PRODUCER_ENABLE_IDEMPOTENCE: "true"
  SPRING_KAFKA_PRODUCER_ACKS: "all"
  SPRING_KAFKA_PRODUCER_LINGER_MS: "100"
  SPRING_KAFKA_PRODUCER_RETRY_BACKOFF_MS: "1000"
  SPRING_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS: "30000"
  SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: "org.springframework.kafka.support.serializer.JsonSerializer"
  
  # Kafka Topics
  KAFKA_TOPICS_EMAIL_NAME: "email-topic"
  KAFKA_TOPICS_SMS_NAME: "sms-topic"
  KAFKA_TOPICS_PUSH_NAME: "push-topic"
  
  # Server конфигурация
  SERVER_SERVLET_CONTEXT_PATH: "/api/v1/auth"
  
  # Auth whitelist
  AUTH_WHITELIST: "/signup,/login,/refresh,/logout,/swagger-ui.html,/v3/api-docs/**,/swagger-ui/**"
  AUTH_ALLOWED_ORIGINS: "*"  # В production укажите конкретные домены


