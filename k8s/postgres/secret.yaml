# Secret для хранения credentials PostgreSQL
# ВАЖНО: В production используйте Kubernetes Secrets или внешний secret manager
# Для создания secret вручную:
# kubectl create secret generic postgres-secret \
#   --from-literal=username=postgres \
#   --from-literal=password=YOUR_SECURE_PASSWORD \
#   --from-literal=database=tracker \
#   --namespace=backend
#
# Или замените данные ниже и примените через kubectl apply

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: backend
  labels:
    app: postgres
    component: database
type: Opaque
stringData:
  # Имя пользователя для подключения к PostgreSQL
  username: postgres
  # Пароль (ЗАМЕНИТЕ НА СИЛЬНЫЙ ПАРОЛЬ В PRODUCTION!)
  password: postgres
  # Имя базы данных
  database: tracker


