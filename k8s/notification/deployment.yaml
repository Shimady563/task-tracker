# Deployment для notification сервиса
# Stateless микросервис для отправки уведомлений (email, SMS, push)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: backend
  labels:
    app: notification
    component: microservice
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification
      component: microservice
  template:
    metadata:
      labels:
        app: notification
        component: microservice
        version: v1
    spec:
      containers:
        - name: notification
          # ВАЖНО: Замените на ваш образ Docker
          image: your-registry/notification:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          # Переменные окружения из ConfigMap
          envFrom:
            - configMapRef:
                name: notification-config
          
          # Переменные окружения из Secret
          env:
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: mail-username
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: mail-password
            - name: SPRING_MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: mail-host
            - name: SPRING_MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: mail-port
          
          # Health checks
          # ВАЖНО: Убедитесь, что в Spring Boot включены отдельные liveness/readiness endpoints
          # Для этого добавьте в application.yaml:
          # management:
          #   endpoint:
          #     health:
          #       probes:
          #         enabled: true
          #   endpoints:
          #     web:
          #       exposure:
          #         include: health,info
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          
          # Ресурсы для контейнера
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          
          # Настройки безопасности
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

