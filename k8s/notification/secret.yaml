# Secret для notification сервиса
# ВАЖНО: В production используйте Kubernetes Secrets или внешний secret manager
# Для создания secret вручную:
# kubectl create secret generic notification-secret \
#   --from-literal=mail-username=your-email@example.com \
#   --from-literal=mail-password=YOUR_EMAIL_PASSWORD \
#   --from-literal=mail-host=smtp.example.com \
#   --from-literal=mail-port=587 \
#   --namespace=backend

apiVersion: v1
kind: Secret
metadata:
  name: notification-secret
  namespace: backend
  labels:
    app: notification
    component: microservice
type: Opaque
stringData:
  # SMTP credentials
  mail-username: "your-email@example.com"  # ЗАМЕНИТЕ НА ВАШ EMAIL!
  mail-password: "your-email-password"  # ЗАМЕНИТЕ НА ВАШ ПАРОЛЬ!
  mail-host: "smtp.gmail.com"  # ЗАМЕНИТЕ НА ВАШ SMTP СЕРВЕР!
  mail-port: "587"  # Обычно 587 для TLS или 465 для SSL


