apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: tracker
  labels:
    app: notification
    component: microservice
data:
  SPRING_PROFILES_ACTIVE: "prod"
  
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  SERVER_SERVLET_CONTEXT_PATH: "/api/v1/notification"
  SERVER_PORT: "8040"
  
  KAFKA_TOPICS_EMAIL_NAME: "email-topic"
  KAFKA_TOPICS_SMS_NAME: "sms-topic"
  KAFKA_TOPICS_PUSH_NAME: "push-topic"
  KAFKA_TOPICS_REMINDER_NAME: "reminder-topic"


