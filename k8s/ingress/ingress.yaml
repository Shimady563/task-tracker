# Ingress для доступа к API сервисам
# Использует nginx ingress controller
# ВАЖНО: Убедитесь, что nginx-ingress controller установлен в кластере
#
# Для установки nginx-ingress controller:
# kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: backend
  labels:
    app: backend
    component: ingress
  annotations:
    # Nginx ingress annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"  # Включите в production с TLS
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"  # Включите в production
    # Настройки для production
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # CORS настройки (настройте под ваши нужды)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"  # В production укажите конкретные домены
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    # Раскомментируйте для использования TLS/SSL
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # Раскомментируйте для использования TLS
  # tls:
  #   - hosts:
  #       - api.example.com
  #     secretName: backend-tls-secret
  ingressClassName: nginx
  rules:
    # Основной API (tracker сервис)
    - host: api.example.com  # ЗАМЕНИТЕ НА ВАШ ДОМЕН!
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracker
                port:
                  number: 80
    # Auth API
    - host: api.example.com  # ЗАМЕНИТЕ НА ВАШ ДОМЕН!
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 80
    # Альтернативный вариант: один host с разными paths
    # Раскомментируйте и используйте вместо вышеописанного, если предпочитаете
    # - host: api.example.com
    #   http:
    #     paths:
    #       - path: /api/v1
    #         pathType: Prefix
    #         backend:
    #           service:
    #             name: tracker
    #             port:
    #               number: 80
    #       - path: /api/v1/auth
    #         pathType: Prefix
    #         backend:
    #           service:
    #             name: auth
    #             port:
    #               number: 80


