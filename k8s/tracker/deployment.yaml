# Deployment для tracker сервиса
# Stateless микросервис для управления задачами

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker
  namespace: backend
  labels:
    app: tracker
    component: microservice
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tracker
      component: microservice
  template:
    metadata:
      labels:
        app: tracker
        component: microservice
        version: v1
    spec:
      containers:
        - name: tracker
          # ВАЖНО: Замените на ваш образ Docker
          image: your-registry/tracker:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          # Переменные окружения из ConfigMap
          envFrom:
            - configMapRef:
                name: tracker-config
          
          # Переменные окружения из Secret
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tracker-secret
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracker-secret
                  key: db-password
            - name: JWT_TOKEN_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: tracker-secret
                  key: jwt-access-secret
            - name: JWT_TOKEN_ACCESS_COOKIE_NAME
              valueFrom:
                secretKeyRef:
                  name: tracker-secret
                  key: jwt-access-cookie-name
          
          # Health checks
          # ВАЖНО: Убедитесь, что в Spring Boot включены отдельные liveness/readiness endpoints
          # Для этого добавьте в application.yaml:
          # management:
          #   endpoint:
          #     health:
          #       probes:
          #         enabled: true
          #   endpoints:
          #     web:
          #       exposure:
          #         include: health,info
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          
          # Ресурсы для контейнера
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          
          # Настройки безопасности
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

