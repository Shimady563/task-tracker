# Service для Redis
# ClusterIP - доступен только внутри кластера
# Используется auth сервисом для кэширования и сессий

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: backend
  labels:
    app: redis
    component: cache
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: redis
    component: cache


