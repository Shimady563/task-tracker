# Secret для Redis пароля
# ВАЖНО: В production используйте Kubernetes Secrets или внешний secret manager

apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: backend
  labels:
    app: redis
    component: cache
type: Opaque
stringData:
  # Пароль для Redis (ЗАМЕНИТЕ НА СИЛЬНЫЙ ПАРОЛЬ В PRODUCTION!)
  password: redis


