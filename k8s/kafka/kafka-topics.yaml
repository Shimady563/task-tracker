# Kafka Topics для микросервисов
# Создаются автоматически через KafkaTopic CRD от Strimzi

apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: email-topic
  namespace: backend
  labels:
    app: kafka
    component: topic
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000  # 7 дней
    segment.ms: 86400000  # 1 день

