apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: tracker
  labels:
    app: kafka
    component: broker
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
      component: broker
  template:
    metadata:
      labels:
        app: kafka
        component: broker
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:8.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: controller
              containerPort: 9093
              protocol: TCP
            - name: listener
              containerPort: 9092
              protocol: TCP
          envFrom:
            - secretRef:
                name: kafka-secret
          livenessProbe:
            tcpSocket:
              port: listener
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: listener
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "1Gi"
              cpu: "512m"

